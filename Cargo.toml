[package]
name = "rnaseq-readsim"
version = "0.2.0"
edition = "2024"
description = "Fast, reproducible simulator of Illumina paired-end bulk RNA-seq reads"
license = "MIT"
readme = "README.md"
keywords = ["rna-seq", "simulation", "fastq", "bioinformatics"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
